name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.85"
          rustflags: -D warnings

      - name: Run cargo fmt
        run: cargo fmt --check

      - name: Run cargo test
        run: cargo test

      - name: Run cargo clippy
        run: cargo clippy --all-targets -- -D warnings
