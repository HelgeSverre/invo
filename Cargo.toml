[package]
name = "invo"
version = "0.1.0"
edition = "2021"
description = "CLI tool to extract structured data from PDF receipts/invoices using LLMs"
license = "MIT"
authors = ["Helge Liseth <helge@lisethsolutions.no>"]
rust-version = "1.85"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Config
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# PDF
pdf-extract = "0.10"

# LLM providers
rig-core = "0.37"

# HTTP (used directly by the Mistral OCR fallback in src/extractor.rs;
# rustls-tls keeps Windows builds clean of OpenSSL)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"

# Async runtime
tokio = { version = "1", features = ["full"] }

# JSON Schema generation
schemars = "1"



# File operations
glob = "0.3"
dirs = "5"
sha2 = "0.10"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Optional: Ollama OCR via PDFium rasterization. Opt-in because PDFium is a
# native dynamic library (cross-platform but a real dependency to install).
pdfium-render = { version = "0.8", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[features]
default = []
# Enables OcrConfig modes that route to Ollama vision models (mode = llm with
# name: ollama, or mode = same when the extractor is ollama). Requires a
# PDFium dynamic library on the system. Install:
#   - macOS (Homebrew):  brew install pdfium    (or download from pdfium-binaries)
#   - Linux:             apt install libpdfium-dev  (or download prebuilt)
#   - Windows:           download pdfium.dll from https://github.com/bblanchon/pdfium-binaries
ollama-ocr = ["dep:pdfium-render", "dep:image"]

[dev-dependencies]
rig-core = { version = "0.37", features = ["test-utils"] }
