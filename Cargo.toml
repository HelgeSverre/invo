[package]
name = "invo"
version = "0.1.0"
edition = "2021"
description = "CLI tool to extract structured data from PDF receipts/invoices using LLMs"
license = "MIT"
authors = ["Helge Liseth <helge@lisethsolutions.no>"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Config
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# PDF
pdf-extract = "0.10"

# LLM providers
rig-core = "0.37"

# Templating
minijinja = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# JSON Schema generation
schemars = "1"

# Parallel processing
rayon = "1"

# File operations
glob = "0.3"
dirs = "5"
sha2 = "0.10"
url = "2"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rig-core = { version = "0.37", features = ["test-utils"] }
