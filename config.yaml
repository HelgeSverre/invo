# invo configuration file
# Location: ~/.config/invo/config.yaml

# Your identity - helps LLM distinguish you (buyer) from vendor (seller)
identity:
  # company: "Your Company Name"
  # name: "Your Name"
  # email: "your@email.com"
  # address: "Street Address, City"
  # vat_number: "NO123456789MVA"
  # aliases:
  #   - "Alternative Name 1"
  #   - "Alternative Name 2"

# LLM provider configuration.
# The first enabled entry is used. --provider selects a configured entry for one run,
# even if that entry is disabled here.
llm:
  providers:
    - name: ollama
      enabled: true
      model: "qwen2.5:1.5b"  # Best small model for structured JSON output
      base_url: "http://localhost:11434"

    # - name: openai
    #   enabled: false
    #   model: "gpt-4o-mini"
    #   api_key_env: "OPENAI_API_KEY"

    # - name: anthropic
    #   enabled: false
    #   model: "claude-sonnet-4-20250514"
    #   api_key_env: "ANTHROPIC_API_KEY"

  extraction:
    temperature: 0.1
    max_tokens: 2000
    retry_attempts: 2

# Known vendors - improves extraction accuracy
vendors: []
  # - name: "Google Workspace"
  #   patterns:
  #     - "Google Ireland Limited"
  #     - "google.com/pay"
  #   currency: "USD"
  #   category: "software"
  #   hints: "Google Workspace receipts often use Google Ireland Limited as the legal vendor."

# Output configuration
output:
  format: json
