# invo configuration file
# Location: ~/.config/invo/config.yaml

# Your identity - helps LLM distinguish you (buyer) from vendor (seller)
identity:
  # company: "Your Company Name"
  # name: "Your Name"
  # email: "your@email.com"
  # address: "Street Address, City"
  # vat_number: "NO123456789MVA"
  # aliases:
  #   - "Alternative Name 1"
  #   - "Alternative Name 2"

# LLM provider configuration.
# The first enabled entry is used. --provider selects a configured entry for one run,
# even if that entry is disabled here.
llm:
  providers:
    - name: ollama
      enabled: true
      model: "qwen2.5:1.5b"  # Best small model for structured JSON output
      base_url: "http://localhost:11434"

    # - name: openai
    #   enabled: false
    #   model: "gpt-4o-mini"
    #   api_key_env: "OPENAI_API_KEY"

    # - name: anthropic
    #   enabled: false
    #   model: "claude-sonnet-4-20250514"
    #   api_key_env: "ANTHROPIC_API_KEY"

  extraction:
    temperature: 0.1
    max_tokens: 2000
    retry_attempts: 2

# Known vendors - improves extraction accuracy
vendors: []
  # - name: "Google Workspace"
  #   patterns:
  #     - "Google Ireland Limited"
  #     - "google.com/pay"
  #   currency: "USD"
  #   category: "software"
  #   hints: "Google Workspace receipts often use Google Ireland Limited as the legal vendor."

# Output configuration
output:
  format: json

# Processing options.
# OCR fallback runs only when native PDF text extraction yields <50 chars
# (image-only / scanned PDFs). Supported backends:
#   - mistral / anthropic / openai: zero native deps, PDF sent inline
#   - ollama: requires --features ollama-ocr (PDFium rasterization)
#
# processing:
#   ocr:
#     mode: none                             # default; OCR disabled
#
#   # Mistral OCR endpoint:
#   # ocr:
#   #   mode: mistral
#   #   model: mistral-ocr-latest            # optional
#   #   api_key_env: MISTRAL_API_KEY         # optional, this is the default
#
#   # Reuse the extractor provider (works for mistral/anthropic/openai;
#   # ollama needs --features ollama-ocr):
#   # ocr:
#   #   mode: same
#
#   # Explicit provider config:
#   # ocr:
#   #   mode: llm
#   #   name: anthropic                      # mistral | anthropic | openai | ollama
#   #   model: claude-3-5-sonnet-latest
#   #   api_key_env: ANTHROPIC_API_KEY
#   #   # base_url: http://localhost:11434   # ollama only
